name: Dependency security audit

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Record audited revision
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Revision: $GITHUB_SHA"
          echo "Ref: $GITHUB_REF_NAME"
          echo "Node.js: $(node --version)"
          echo "npm: $(npm --version)"
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate actionable advisory summary (report-only)
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_status=$?
          echo "npm audit exit code: $audit_status (non-zero means advisories were found or audit failed)"
          node -e '
            const fs = require("node:fs");
            const p = process.argv[1];
            try {
              const a = JSON.parse(fs.readFileSync(p, "utf8"));
              console.log("Severity totals:");
              console.log(JSON.stringify(a.metadata?.vulnerabilities ?? null, null, 2));
              const rows = Object.entries(a.vulnerabilities ?? {}).map(([name, v]) => ({
                package: name,
                severity: v.severity,
                direct: v.isDirect,
                range: v.range,
                fixAvailable: v.fixAvailable ?? false,
                via: (v.via ?? []).map(x => typeof x === "string" ? x : x.title)
              }));
              rows.sort((x, y) => {
                const rank = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };
                return (rank[x.severity] ?? 5) - (rank[y.severity] ?? 5) || x.package.localeCompare(y.package);
              });
              console.log("Affected package summary:");
              console.log(JSON.stringify(rows, null, 2));
            } catch (e) {
              console.error("Could not parse npm audit JSON:", e.message);
              process.exitCode = 1;
            }
          ' "$RUNNER_TEMP/npm-audit.json"
          exit 0
      - name: Upload full npm audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-report
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: warn
          retention-days: 30
