name: PortalDot RPC health

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  rpc-health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Configure public testnet endpoint
        run: |
          echo "PORTALDOT_RPC_URL=https://test-evm-rpc-v3.portaldot.dev" >> "$GITHUB_ENV"
          echo "PORTALDOT_CHAIN_ID=420420777" >> "$GITHUB_ENV"
      - name: Read-only RPC health check
        run: npm run monitor:rpc
