name: Deploy Web3 DApp to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web3-dapp/**"
      - "scripts/smoke-published-dapp.py"
      - ".github/workflows/deploy-dapp-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "web3-dapp/**"
      - ".github/workflows/deploy-dapp-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("web3-dapp/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          Path("/tmp/verigate-dapp-inline.js").write_text("\n\n".join(scripts))
          PY
          node --check /tmp/verigate-dapp-inline.js
      - name: Validate receipt lookup module syntax
        run: node --check web3-dapp/receipt-lookup.mjs
      - name: Validate Explorer inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("web3-dapp/explorer/index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.IGNORECASE | re.DOTALL)
          if not scripts:
              raise SystemExit("No inline JavaScript found in Explorer")
          Path("/tmp/portal-dot-explorer-inline.js").write_text("\n\n".join(scripts))
          PY
          node --check /tmp/portal-dot-explorer-inline.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Validate and package static DApp
        shell: bash
        run: |
          set -euo pipefail
          test -s web3-dapp/index.html
          grep -q "test-evm-rpc-v3.portaldot.dev" web3-dapp/index.html
          grep -q "eth_chainId" web3-dapp/index.html
          grep -q "authoritySigner" web3-dapp/index.html
          grep -q 'import("./receipt-lookup.mjs")' web3-dapp/index.html
          test -s web3-dapp/receipt-lookup.mjs
          node --check web3-dapp/receipt-lookup.mjs
          test -s web3-dapp/explorer/index.html
          grep -q "eth_getTransactionByHash" web3-dapp/explorer/index.html
          grep -q "test-evm-rpc-v3.portaldot.dev" web3-dapp/explorer/index.html
          mkdir -p _site/explorer
          cp web3-dapp/index.html _site/index.html
          cp web3-dapp/receipt-lookup.mjs _site/receipt-lookup.mjs
          cp web3-dapp/explorer/index.html _site/explorer/index.html
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  browser-smoke:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    # Include distro packages + Chromium download + public RPC browser checks.
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Playwright
        run: python -m pip install --disable-pip-version-check "playwright==1.64.0"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Test the published page in Chromium
        env:
          VERIGATE_DAPP_URL: https://rudimentall1.github.io/verigate-portaldot/
        run: python scripts/smoke-published-dapp.py
