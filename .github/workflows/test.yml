name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardhat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run compile
