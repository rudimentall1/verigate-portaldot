name: Hardhat 3 migration preview

on:
  push:
    branches:
      - chore/hardhat3-migration-preview
    paths:
      - ".github/workflows/hardhat3-migration-preview.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  migration-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare isolated Hardhat 3 dependency candidate
        shell: bash
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/hardhat3-preview"
          cp package.json package-lock.json "$RUNNER_TEMP/hardhat3-preview/"
          npm ci --no-audit --no-fund
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete p.devDependencies['@nomicfoundation/hardhat-toolbox'];
          p.devDependencies['@nomicfoundation/hardhat-toolbox-mocha-ethers'] = '^4.0.0';
          p.devDependencies.hardhat = '^3.20.0';
          p.engines.node = '>=22.13.0';
          p.type = 'module';
          p.scripts.compile = 'hardhat build';
          p.scripts.test = 'hardhat test';
          p.scripts['deploy:portaldot'] = 'npm run preflight && hardhat run scripts/deploy.mjs --network portaldot';
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          fs.writeFileSync('package-candidate.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          cp package-candidate.json "$RUNNER_TEMP/hardhat3-preview/package-candidate.json"
      - name: Generate candidate lockfile from a clean dependency tree
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          set +e
          npm install --package-lock-only --ignore-scripts --no-fund > "$RUNNER_TEMP/hardhat3-preview/lockfile-generation.log" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/hardhat3-preview/lockfile-generation.exit-code"
          cat "$RUNNER_TEMP/hardhat3-preview/lockfile-generation.log"
          if [ "$status" -eq 0 ]; then cp package-lock.json "$RUNNER_TEMP/hardhat3-preview/package-lock-candidate.json"; fi
          exit 0
      - name: Apply isolated ESM and Hardhat 3 compatibility overlay
        shell: bash
        run: |
          set -e
          mv hardhat.config.js hardhat.config.hardhat2.cjs
          cat > hardhat.config.ts <<'CONFIG'
          import { defineConfig } from "hardhat/config";
          import hardhatToolboxMochaEthers from "@nomicfoundation/hardhat-toolbox-mocha-ethers";
          import "dotenv/config";

          const networks: Record<string, any> = {
            hardhatMainnet: { type: "edr-simulated", chainType: "l1", chainId: 31337 }
          };

          const rpcUrl = (process.env.PORTALDOT_RPC_URL || "").trim();
          const chainIdText = (process.env.PORTALDOT_CHAIN_ID || "").trim();
          if (Boolean(rpcUrl) !== Boolean(chainIdText)) {
            throw new Error("PORTALDOT_RPC_URL and PORTALDOT_CHAIN_ID must be configured together.");
          }
          if (rpcUrl && chainIdText) {
            if (!/^[1-9][0-9]*$/.test(chainIdText)) {
              throw new Error("PORTALDOT_CHAIN_ID must be a canonical positive decimal integer.");
            }
            const parsedUrl = new URL(rpcUrl);
            if (!["http:", "https:"].includes(parsedUrl.protocol)) {
              throw new Error("PORTALDOT_RPC_URL must use HTTP or HTTPS.");
            }
            if (parsedUrl.protocol === "http:" && !["localhost", "127.0.0.1", "[::1]"].includes(parsedUrl.hostname)) {
              throw new Error("Remote RPC endpoints must use HTTPS.");
            }
            const chainId = Number(chainIdText);
            if (!Number.isSafeInteger(chainId) || chainId <= 0) {
              throw new Error("PORTALDOT_CHAIN_ID must be a positive safe integer.");
            }
            networks.portaldot = {
              type: "http",
              chainType: "generic",
              url: rpcUrl,
              chainId,
              accounts: process.env.DEPLOYER_PRIVATE_KEY ? [process.env.DEPLOYER_PRIVATE_KEY] : []
            };
          }

          export default defineConfig({
            plugins: [hardhatToolboxMochaEthers],
            solidity: { version: "0.8.24", settings: { optimizer: { enabled: true, runs: 200 } } },
            networks
          });
          CONFIG
          printf '{"type":"commonjs"}\n' > scripts/package.json
          printf '{"type":"commonjs"}\n' > adapter/package.json
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of fs.readdirSync('test').filter((name) => name.endsWith('.js'))) {
            let source = fs.readFileSync('test/' + file, 'utf8');
            source = "import { createRequire } from 'node:module';\nconst require = createRequire(import.meta.url);\n" + source;
            source = source.replace(
              'const { ethers } = require("hardhat");',
              'const hre = (await import("hardhat")).default;\nconst { ethers } = await hre.network.create();'
            );
            fs.writeFileSync('test/' + file, source);
          }
          const deploy = fs.readFileSync('scripts/deploy.js', 'utf8');
          const migrated = deploy.replace(
            'require("dotenv").config();\nconst { ethers } = require("hardhat");',
            'import "dotenv/config";\nconst hre = (await import("hardhat")).default;\nconst { ethers } = await hre.network.create();'
          );
          if (migrated === deploy) throw new Error("Could not transform deployment entrypoint to ESM.");
          fs.writeFileSync('scripts/deploy.mjs', migrated);
          NODE
          rm -rf artifacts cache dist
          for file in .github/workflows/test.yml .github/workflows/ci.yml .github/workflows/dependency-audit.yml; do
            sed -i 's/node-version: 20/node-version: 22/g' "$file"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.github/workflows/test.yml';
          let workflow = fs.readFileSync(file, 'utf8');
          if (!/^  workflow_dispatch:/m.test(workflow)) {
            workflow = workflow.replace('on:\n  push:\n  pull_request:\n', 'on:\n  push:\n  pull_request:\n  workflow_dispatch:\n');
          }
          fs.writeFileSync(file, workflow);
          NODE
          cp hardhat.config.ts "$RUNNER_TEMP/hardhat3-preview/hardhat.config.candidate.ts"
      - name: Install candidate dependencies reproducibly
        shell: bash
        run: |
          set +e
          npm ci --no-fund > "$RUNNER_TEMP/hardhat3-preview/npm-ci.log" 2>&1
          status=$?
          echo "$status" > "$RUNNER_TEMP/hardhat3-preview/npm-ci.exit-code"
          cat "$RUNNER_TEMP/hardhat3-preview/npm-ci.log"
          exit "$status"
      - name: Test candidate and compile contracts
        shell: bash
        run: |
          set +e
          npm test > "$RUNNER_TEMP/hardhat3-preview/npm-test.log" 2>&1
          test_status=$?
          echo "$test_status" > "$RUNNER_TEMP/hardhat3-preview/npm-test.exit-code"
          cat "$RUNNER_TEMP/hardhat3-preview/npm-test.log"
          npm run compile > "$RUNNER_TEMP/hardhat3-preview/compile.log" 2>&1
          compile_status=$?
          echo "$compile_status" > "$RUNNER_TEMP/hardhat3-preview/compile.exit-code"
          cat "$RUNNER_TEMP/hardhat3-preview/compile.log"
          npm audit --json > "$RUNNER_TEMP/hardhat3-preview/npm-audit.json"
          audit_status=$?
          echo "$audit_status" > "$RUNNER_TEMP/hardhat3-preview/npm-audit.exit-code"
          node -e 'const a=require(process.argv[1]); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? null,null,2))' "$RUNNER_TEMP/hardhat3-preview/npm-audit.json" || true
          node -e 'const fs=require("node:fs"); const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const total=a.metadata?.vulnerabilities?.total; console.log("Audit findings total:", total); if (total !== 0) process.exit(1)' "$RUNNER_TEMP/hardhat3-preview/npm-audit.json" > "$RUNNER_TEMP/hardhat3-preview/audit-clean.log" 2>&1
          audit_clean_status=$?
          echo "$audit_clean_status" > "$RUNNER_TEMP/hardhat3-preview/audit-clean.exit-code"
          cat "$RUNNER_TEMP/hardhat3-preview/audit-clean.log"
          if [ "$test_status" -ne 0 ] || [ "$compile_status" -ne 0 ]; then exit 1; fi
      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardhat3-migration-preview
          path: ${{ runner.temp }}/hardhat3-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Mark candidate result
        if: always()
        shell: bash
        run: |
          for file in lockfile-generation npm-ci npm-test compile audit-clean; do
            path="$RUNNER_TEMP/hardhat3-preview/$file.exit-code"
            if [ ! -f "$path" ] || [ "$(cat "$path")" != "0" ]; then
              echo "Candidate stage failed: $file"
              exit 1
            fi
          done

      - name: Commit validated migration on isolated branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/chore/hardhat3-migration-preview'
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-candidate.json hardhat.config.hardhat2.cjs scripts/deploy.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: migrate PortalDot bridge to Hardhat 3"
          git push origin HEAD:chore/hardhat3-migration-preview
      - name: Dispatch normal CI for committed migration
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/chore/hardhat3-migration-preview'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run test.yml --ref chore/hardhat3-migration-preview
          gh workflow run ci.yml --ref chore/hardhat3-migration-preview
          gh workflow run dependency-audit.yml --ref chore/hardhat3-migration-preview
