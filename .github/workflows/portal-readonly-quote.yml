name: Temporary PortalDot read-only deployment quote

on:
  push:
    branches: [chore/hardhat3-migration-preview]
    paths:
      - ".github/workflows/portal-readonly-quote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-quote:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Compile contract
        run: npm run compile
      - name: Run read-only live deployment estimate
        id: estimate
        env:
          PORTALDOT_RPC_URL: https://test-evm-rpc-v3.portaldot.dev
          PORTALDOT_CHAIN_ID: "420420777"
          DEPLOYMENT_ESTIMATE_FROM: "0x4c07B4f328FA738290Db96BCE2F9CBc4d020D2CB"
        shell: bash
        run: |
          set +e
          node scripts/estimate-deployment.mjs 2>&1 | tee "$RUNNER_TEMP/portal-readonly-estimate.txt"
          status=${PIPESTATUS[0]}
          echo "estimator_exit_code=$status" | tee -a "$RUNNER_TEMP/portal-readonly-estimate.txt"
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload sanitized read-only estimate result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-readonly-estimate
          path: ${{ runner.temp }}/portal-readonly-estimate.txt
          if-no-files-found: warn
          retention-days: 3
