name: Explorer live smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorer-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public API health and live chain connectivity
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://verigate-portaldot-explorer.onrender.com"
          EXPECTED_GENESIS="0xd4f9acbcf7f52388d8b095abe3c198d19fc510e0343e643e87cfbccb155283bd"

          # Keep valid fallback JSON so diagnostics still print if every status request fails.
          printf '{}' > /tmp/evm.json
          printf '{}' > /tmp/substrate.json

          # A free Render instance can be asleep, and Substrate reconnects asynchronously.
          curl --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 -fsS "$BASE/health" -o /tmp/health.json
          jq -e '.ok == true and .service == "portal-dot-explorer"' /tmp/health.json >/dev/null

          READY=false
          for attempt in $(seq 1 12); do
            EVM_OK=false
            SUBSTRATE_OK=false
            if curl --max-time 12 -fsS "$BASE/api/status" -o /tmp/evm.json; then EVM_OK=true; fi
            if curl --max-time 12 -fsS "$BASE/api/substrate/status" -o /tmp/substrate.json; then SUBSTRATE_OK=true; fi

            EVM_CHAIN_ID="$(jq -r '.live.chainId // .chainId // empty' /tmp/evm.json)"
            ACTUAL_GENESIS="$(jq -r '.actualGenesisHash // empty' /tmp/substrate.json)"
            SUBSTRATE_CONNECTED="$(jq -r '.connected // false' /tmp/substrate.json)"

            if [[ "$EVM_OK" == "true" && "$SUBSTRATE_OK" == "true" && "$EVM_CHAIN_ID" == "420420777" && "$ACTUAL_GENESIS" == "$EXPECTED_GENESIS" && "$SUBSTRATE_CONNECTED" == "true" ]]; then
              READY=true
              break
            fi

            echo "Waiting for live RPC readiness (attempt $attempt/12): EVM HTTP=$EVM_OK chainId=${EVM_CHAIN_ID:-<empty>}; Substrate HTTP=$SUBSTRATE_OK connected=$SUBSTRATE_CONNECTED; genesis=${ACTUAL_GENESIS:-<empty>}"
            sleep 5
          done

          echo "=== API health ==="
          jq . /tmp/health.json
          echo "=== EVM RPC and indexer status ==="
          jq '{connected: .live.connected, chainId: .live.chainId, chainMatches: .chainMatches, latestBlock: .live.latestBlock, indexer: {indexedThrough: .indexer.indexedThrough, startedFrom: .indexer.startedFrom, blocksStored: .indexer.blocksStored, transactionsStored: .indexer.transactionsStored, logsStored: .indexer.logsStored, gapCount: .indexer.gapCount, lastBatchAt: .indexer.lastBatchAt}, error: .live.error}' /tmp/evm.json
          echo "=== Substrate RPC and indexer status ==="
          jq '{connected, expectedGenesisHash, actualGenesisHash, latestFinalized, indexedThrough, processedThrough, startedFrom, blocksStored, extrinsicsStored, eventsStored, gapCount, lastBatchAt, error}' /tmp/substrate.json

          if [[ "$READY" != "true" ]]; then
            echo "::error::Explorer API did not reach a healthy EVM and Substrate RPC state within the retry window."
            exit 1
          fi
