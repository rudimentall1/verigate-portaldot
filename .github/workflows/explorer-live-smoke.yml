name: Explorer live smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorer-live-smoke.yml"
      - "services/explorer-service.mjs"
      - "render.yaml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check public API health and live chain connectivity
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://verigate-portaldot-explorer.onrender.com"
          EXPECTED_GENESIS="0xd4f9acbcf7f52388d8b095abe3c198d19fc510e0343e643e87cfbccb155283bd"

          # Keep valid fallback JSON so diagnostics still print if every status request fails.
          printf '{}' > /tmp/evm.json
          printf '{}' > /tmp/substrate.json

          # A free Render instance can be asleep, and Substrate reconnects asynchronously.
          curl --retry 3 --retry-delay 5 --retry-all-errors --max-time 30 -fsS "$BASE/health" -o /tmp/health.json
          jq -e '.ok == true and .service == "portal-dot-explorer"' /tmp/health.json >/dev/null

          READY=false
          for attempt in $(seq 1 12); do
            EVM_OK=false
            SUBSTRATE_OK=false
            if curl --max-time 12 -fsS "$BASE/api/status" -o /tmp/evm.json; then EVM_OK=true; fi
            if curl --max-time 12 -fsS "$BASE/api/substrate/status" -o /tmp/substrate.json; then SUBSTRATE_OK=true; fi

            EVM_CHAIN_ID="$(jq -r '.live.chainId // .chainId // empty' /tmp/evm.json)"
            EVM_CONNECTED="$(jq -r '.live.connected // false' /tmp/evm.json)"
            CHAIN_MATCHES="$(jq -r '.chainMatches // false' /tmp/evm.json)"
            ACTUAL_GENESIS="$(jq -r '.actualGenesisHash // empty' /tmp/substrate.json)"
            SUBSTRATE_CONNECTED="$(jq -r '.connected // false' /tmp/substrate.json)"

            if [[ "$EVM_OK" == "true" && "$SUBSTRATE_OK" == "true" && "$EVM_CHAIN_ID" == "420420777" && "$EVM_CONNECTED" == "true" && "$CHAIN_MATCHES" == "true" && "$ACTUAL_GENESIS" == "$EXPECTED_GENESIS" && "$SUBSTRATE_CONNECTED" == "true" ]]; then
              READY=true
              break
            fi

            echo "Waiting for live RPC readiness (attempt $attempt/12): EVM HTTP=$EVM_OK connected=$EVM_CONNECTED chainId=${EVM_CHAIN_ID:-<empty>} chainMatches=$CHAIN_MATCHES; Substrate HTTP=$SUBSTRATE_OK connected=$SUBSTRATE_CONNECTED; genesis=${ACTUAL_GENESIS:-<empty>}"
            sleep 5
          done

          echo "=== Direct PortalDot EVM historical-availability probe ==="
          RPC="https://test-evm-rpc-v3.portaldot.dev"
          HEAD_HEX="$(curl --max-time 15 -fsS -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_blockNumber","params":[]}' "$RPC" | jq -r '.result')"
          HEAD=$((HEAD_HEX))
          for BLOCK in "$HEAD" "$((HEAD - 6))" "$((HEAD - 20))" "$((HEAD - 1000))" 110000; do
            (( BLOCK < 0 )) && continue
            printf -v BLOCK_HEX '0x%x' "$BLOCK"
            PAYLOAD="$(jq -nc --arg block "$BLOCK_HEX" '{jsonrpc:"2.0",id:1,method:"eth_getBlockByNumber",params:[$block,true]}')"
            RESULT="$(curl --max-time 15 -sS -H 'content-type: application/json' --data "$PAYLOAD" "$RPC" | jq -c '{result: (if .result == null then null else {number:.result.number,hash:.result.hash,transactions:(.result.transactions|length)} end),error:(.error.message // null)}')"
            echo "block=$BLOCK $RESULT"
          done

          echo "=== API health ==="
          jq . /tmp/health.json
          echo "=== EVM RPC and indexer status ==="
          jq '{connected: .live.connected, chainId: .live.chainId, chainMatches: .chainMatches, latestBlock: .live.latestBlock, indexer: {indexedThrough: .indexer.indexedThrough, startedFrom: .indexer.startedFrom, blocksStored: .indexer.blocksStored, transactionsStored: .indexer.transactionsStored, logsStored: .indexer.logsStored, gapCount: .indexer.gapCount, lastBatchAt: .indexer.lastBatchAt, firstGaps: (.indexer.gaps[0:3] // [])}, error: .live.error}' /tmp/evm.json
          echo "=== Substrate RPC and indexer status ==="
          jq '{connected, expectedGenesisHash, actualGenesisHash, latestFinalized, indexedThrough, processedThrough, startedFrom, blocksStored, extrinsicsStored, eventsStored, gapCount, lastBatchAt, error}' /tmp/substrate.json

          if [[ "$READY" != "true" ]]; then
            echo "::error::Explorer API did not reach a healthy EVM and Substrate RPC state within the retry window."
            exit 1
          fi

          echo "=== Require actual EVM indexing progress ==="
          INDEXED=false
          for attempt in $(seq 1 8); do
            curl --max-time 12 -fsS "$BASE/api/status" -o /tmp/evm.json
            BLOCKS_STORED="$(jq -r '.indexer.blocksStored // 0' /tmp/evm.json)"
            INDEXED_THROUGH="$(jq -r '.indexer.indexedThrough // empty' /tmp/evm.json)"
            LATEST_BLOCK="$(jq -r '.live.latestBlock // 0' /tmp/evm.json)"
            if [[ "$BLOCKS_STORED" =~ ^[0-9]+$ && "$INDEXED_THROUGH" =~ ^[0-9]+$ && "$LATEST_BLOCK" =~ ^[0-9]+$ ]] &&
               (( BLOCKS_STORED > 0 && LATEST_BLOCK - INDEXED_THROUGH <= 100 )); then
              INDEXED=true
              break
            fi
            echo "Waiting for EVM indexer progress (attempt $attempt/8): blocksStored=$BLOCKS_STORED indexedThrough=${INDEXED_THROUGH:-<null>} latestBlock=$LATEST_BLOCK"
            sleep 5
          done
          jq '{latestBlock: .live.latestBlock, indexer: {startedFrom: .indexer.startedFrom, indexedThrough: .indexer.indexedThrough, blocksStored: .indexer.blocksStored, transactionsStored: .indexer.transactionsStored, logsStored: .indexer.logsStored, gapCount: .indexer.gapCount}}' /tmp/evm.json
          if [[ "$INDEXED" != "true" ]]; then
            echo "::error::EVM RPC is reachable, but the indexer is not storing a recent contiguous block range."
            exit 1
          fi
