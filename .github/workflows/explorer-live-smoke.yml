name: Explorer live smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/explorer-live-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public API health and JSON endpoints
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://verigate-portaldot-explorer.onrender.com"

          curl --retry 3 --retry-delay 5 --retry-all-errors --max-time 25 -fsS "$BASE/health" -o /tmp/health.json
          jq -e '.ok == true and .service == "portal-dot-explorer"' /tmp/health.json >/dev/null

          curl --retry 2 --retry-delay 3 --retry-all-errors --max-time 30 -fsS "$BASE/api/status" -o /tmp/evm.json
          curl --retry 2 --retry-delay 3 --retry-all-errors --max-time 30 -fsS "$BASE/api/substrate/status" -o /tmp/substrate.json

          jq -e 'type == "object"' /tmp/evm.json >/dev/null
          jq -e 'type == "object" and has("connected") and has("expectedGenesisHash") and has("actualGenesisHash")' /tmp/substrate.json >/dev/null

          echo "=== API health ==="
          jq . /tmp/health.json
          echo "=== EVM indexer/RPC status ==="
          jq '{connected: (.live.connected // .connected // null), chainId: (.live.chainId // .chainId // null), latestBlock: (.live.latestBlock // .latestBlock // null), error: (.live.error // .error // null)}' /tmp/evm.json
          echo "=== Substrate indexer/RPC status ==="
          jq '{connected, expectedGenesisHash, actualGenesisHash, cursor, contiguousThrough, error: (.error // .substrateError // null)}' /tmp/substrate.json

          EXPECTED_GENESIS="0xd4f9acbcf7f52388d8b095abe3c198d19fc510e0343e643e87cfbccb155283bd"
          ACTUAL_GENESIS="$(jq -r '.actualGenesisHash // empty' /tmp/substrate.json)"
          if [[ "$ACTUAL_GENESIS" != "$EXPECTED_GENESIS" ]]; then
            echo "::error::Substrate RPC genesis mismatch or unavailable. Expected $EXPECTED_GENESIS, got ${ACTUAL_GENESIS:-<empty>}."
            exit 1
          fi
          if [[ "$(jq -r '.connected' /tmp/substrate.json)" != "true" ]]; then
            echo "::error::Substrate indexer is not connected."
            exit 1
          fi

          EVM_CHAIN_ID="$(jq -r '.live.chainId // .chainId // empty' /tmp/evm.json)"
          if [[ "$EVM_CHAIN_ID" != "420420777" ]]; then
            echo "::error::EVM RPC chain ID mismatch or unavailable. Expected 420420777, got ${EVM_CHAIN_ID:-<empty>}."
            exit 1
          fi
