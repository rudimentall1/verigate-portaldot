name: PortalDot Substrate runtime metadata

on:
  push:
    branches: [main, chore/hardhat3-migration-preview]
    paths:
      - "scripts/substrate-runtime-preflight.mjs"
      - "test/substrate-runtime-preflight.test.js"
      - ".github/workflows/portaldot-substrate-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Read-only Substrate runtime fingerprint
        id: inspect
        continue-on-error: true
        env:
          PORTALDOT_SUBSTRATE_RPC_URL: wss://test-node-v3.portaldot.dev
        run: |
          mkdir -p "$RUNNER_TEMP/substrate-runtime-evidence"
          set +e
          npm run --silent inspect:substrate-runtime > "$RUNNER_TEMP/substrate-runtime-evidence/runtime-metadata.json" 2>&1
          inspector_exit_code=$?
          printf '%s\n' "$inspector_exit_code" > "$RUNNER_TEMP/substrate-runtime-evidence/inspector-exit-code.txt"
          cat "$RUNNER_TEMP/substrate-runtime-evidence/runtime-metadata.json"
          exit "$inspector_exit_code"
      - name: Decode live Revive storage metadata (read-only)
        id: decode
        continue-on-error: true
        env:
          PORTALDOT_SUBSTRATE_RPC_URL: wss://test-node-v3.portaldot.dev
          DOT_HOME: ${{ runner.temp }}/polkadot-cli-home
          DOT_NO_UPDATE_CHECK: "1"
        run: |
          mkdir -p "$RUNNER_TEMP/substrate-runtime-evidence" "$DOT_HOME"
          npm install --global polkadot-cli@0.7.0
          dot --version > "$RUNNER_TEMP/substrate-runtime-evidence/dot-cli-version.txt" 2>&1
          dot chain add portaldot-v3 --rpc "$PORTALDOT_SUBSTRATE_RPC_URL" > "$RUNNER_TEMP/substrate-runtime-evidence/dot-chain-add.txt" 2>&1
          dot chain update portaldot-v3 >> "$RUNNER_TEMP/substrate-runtime-evidence/dot-chain-add.txt" 2>&1
          run_capture() {
            name="$1"
            shift
            set +e
            "$@" > "$RUNNER_TEMP/substrate-runtime-evidence/$name.txt" 2>&1
            result=$?
            set -e
            printf '%s\n' "$result" > "$RUNNER_TEMP/substrate-runtime-evidence/$name-exit-code.txt"
          }
          run_capture dot-chain-list dot chain list
          run_capture revive-pallet-metadata dot inspect Revive --chain portaldot-v3
          run_capture OriginalAccount-storage-definition dot inspect Revive.OriginalAccount --chain portaldot-v3
          run_capture AddressSuffix-storage-definition dot inspect Revive.AddressSuffix --chain portaldot-v3
          # Query a synthetic H160 only; never enumerate the live mapping or log a user's candidate address.
          run_capture synthetic-account-mapping-query dot query Revive.OriginalAccount 0x0000000000000000000000000000000000000001 --chain portaldot-v3
          run_capture revive-chain-id dot const Revive.ChainId --chain portaldot-v3
          run_capture revive-native-to-eth-ratio dot const Revive.NativeToEthRatio --chain portaldot-v3
          run_capture revive-auto-map dot const Revive.AutoMap --chain portaldot-v3
          run_capture revive-deposit-per-byte dot const Revive.DepositPerByte --chain portaldot-v3
          run_capture revive-deposit-per-item dot const Revive.DepositPerItem --chain portaldot-v3
          run_capture revive-deposit-per-child-trie-item dot const Revive.DepositPerChildTrieItem --chain portaldot-v3
          run_capture revive-gas-scale dot const Revive.GasScale --chain portaldot-v3
          run_capture revive-code-hash-lockup-deposit-percent dot const Revive.CodeHashLockupDepositPercent --chain portaldot-v3
          run_capture revive-allow-evm-bytecode dot const Revive.AllowEVMBytecode --chain portaldot-v3
      - name: Upload runtime metadata evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portaldot-substrate-runtime-metadata
          path: ${{ runner.temp }}/substrate-runtime-evidence/
          if-no-files-found: warn
          retention-days: 14
