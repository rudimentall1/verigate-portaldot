name: PortalDot CI

on:
  push:
    branches: [main, chore/hardhat3-migration-preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Explorer service syntax
        run: node --check services/explorer-service.mjs
      - name: Run local contract, bridge and Explorer tests
        run: npm test
      - name: Compile contracts
        run: npm run compile
      - name: Verify deployment uses selected PortalDot network and never sends transactions
        run: node scripts/deploy-network-smoke.mjs

  verigate-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PortalDot bridge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out Verigate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: rudimentall1/verigate
          # Keep the integration source reproducible; update this SHA deliberately.
          ref: de24e7a02911b5803bac60f799bc1ab37891fec2 # upstream snapshot checked 2026-10-19
          path: verigate-upstream
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install bridge dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Verigate API dependencies
        run: python -m pip install -r verigate-upstream/requirements.txt
      - name: Run isolated Verigate ALLOW/BLOCK integration
        run: |
          mkdir -p "$RUNNER_TEMP/verigate-portaldot-evidence"
          python scripts/verigate_local_demo.py --verigate-root "$GITHUB_WORKSPACE/verigate-upstream" --output-dir "$RUNNER_TEMP/verigate-portaldot-evidence"
      - name: Upload isolated integration evidence
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-verigate-api-evidence
          path: ${{ runner.temp }}/verigate-portaldot-evidence/
          if-no-files-found: error
          retention-days: 14
