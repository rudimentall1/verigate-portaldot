name: PortalDot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run local contract and bridge tests
        run: npm test
      - name: Compile contracts
        run: npm run compile

  verigate-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PortalDot bridge
        uses: actions/checkout@v4
      - name: Check out Verigate source
        uses: actions/checkout@v4
        with:
          repository: rudimentall1/verigate
          ref: main
          path: verigate-upstream
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bridge dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Verigate API dependencies
        run: python -m pip install -r verigate-upstream/requirements.txt
      - name: Run isolated Verigate ALLOW/BLOCK integration
        run: |
          mkdir -p "$RUNNER_TEMP/verigate-portaldot-evidence"
          python scripts/verigate_local_demo.py --verigate-root "$GITHUB_WORKSPACE/verigate-upstream" --output-dir "$RUNNER_TEMP/verigate-portaldot-evidence"
      - name: Upload isolated integration evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-verigate-api-evidence
          path: ${{ runner.temp }}/verigate-portaldot-evidence/
          if-no-files-found: error
          retention-days: 14
