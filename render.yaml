services:
  - type: web
    name: verigate-portaldot-explorer
    runtime: node
    plan: starter
    buildCommand: npm ci --no-audit --no-fund
    startCommand: npm run explorer:service
    healthCheckPath: /health
    disk:
      name: explorer-data
      mountPath: /var/data
      sizeGB: 2
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: PORTALDOT_RPC_URL
        value: https://test-evm-rpc-v3.portaldot.dev
      - key: PORTALDOT_CHAIN_ID
        value: "420420777"
      - key: PORTALDOT_SUBSTRATE_RPC_URL
        value: wss://test-node-v3.portaldot.dev
      - key: PORTALDOT_SUBSTRATE_GENESIS_HASH
        value: "0xd4f9acbcf7f52388d8b095abe3c198d19fc510e0343e643e87cfbccb155283bd"
      - key: SUBSTRATE_START_BLOCK
        value: "110000"
      - key: SUBSTRATE_BACKFILL_BLOCKS
        value: "30000"
      - key: SUBSTRATE_BATCH_BLOCKS
        value: "10"
      - key: SUBSTRATE_SNAPSHOT_INTERVAL_MS
        value: "900000"
      - key: SUBSTRATE_SNAPSHOT_PAGE_SIZE
        value: "500"
      - key: SUBSTRATE_SNAPSHOT_MAX_ROWS
        value: "100000"
      - key: EXPLORER_DB_PATH
        value: /var/data/portal-dot-explorer.sqlite
      - key: EXPLORER_START_BLOCK
        value: "110000"
      - key: EXPLORER_BATCH_BLOCKS
        value: "20"
      - key: EXPLORER_CONFIRMATIONS
        value: "6"
      - key: EXPLORER_POLL_MS
        value: "6000"
      - key: EXPLORER_ALLOWED_ORIGINS
        value: https://rudimentall1.github.io
